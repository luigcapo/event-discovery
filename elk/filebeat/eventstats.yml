filebeat.inputs:
- type: filestream
  id: eventstats-logs
  enabled: true
  paths:
    - /usr/share/filebeat/logs/app.json
  json.keys_under_root: true
  json.add_error_key: true
  json.message_key: message

processors:
  - add_fields:
      target: ''
      fields:
        service.name: eventstats

output.elasticsearch:
  hosts: ["elasticsearch:9200"]

setup.kibana:
  host: "kibana:5601"
