spring:
  application:
    name: event-stats
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      enable-auto-commit: false
      max-poll-records: 10
      auto-offset-reset: earliest
    listener:
      type: single
  data:
    redis:
      host: ${REDIS_HOST:redis-event}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:devpassword}
app:
  kafka:
    topic:
      eventCreated: event.created
      eventCreatedImpaired: event.created.impair
    group:
      id: event-stats-group
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # 100% des requêtes sont échantillonnées
  # Configuration unifiée et moderne pour OTLP
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
logging:
  file:
    path: ${APPLICATION_LOG_PATH_EVENT_STATS:../logs/eventstats}
